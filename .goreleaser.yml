version: 2

env:
  - GO111MODULE=on
  - CGO_ENABLED=0
  - GITHUB_ORG=jr1machado

project_name: MailView

before:
  hooks:
    - make build-frontend

builds:
  - id: mailview
    binary: mailview
    main: ./cmd
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 6
      - 7
    ignore:
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X "main.buildString={{ .Tag }} ({{ .ShortCommit }} {{ .Date }}, {{ .Os }}/{{ .Arch }})" -X "main.versionString={{ .Tag }}"

    hooks:
      # stuff executables with static assets.
      post: make pack-bin BIN={{ .Path }}

archives:
  - id: mailview
    name_template: "MailView_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

dockers:
  - use: buildx
    goos: linux
    goarch: amd64
    ids:
      - mailview
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - config.toml.sample
      - docker-entrypoint.sh
  - use: buildx
    goos: linux
    goarch: arm64
    ids:
      - mailview
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-arm64v8"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-arm64v8"
    build_flag_templates:
      - --platform=linux/arm64/v8
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - config.toml.sample
      - docker-entrypoint.sh
  - use: buildx
    goos: linux
    goarch: arm
    goarm: 6
    ids:
      - mailview
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-armv6"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-armv6"
    build_flag_templates:
      - --platform=linux/arm/v6
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - config.toml.sample
      - docker-entrypoint.sh
  - use: buildx
    goos: linux
    goarch: arm
    goarm: 7
    ids:
      - mailview
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-armv7"
      - "ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-armv7"
    build_flag_templates:
      - --platform=linux/arm/v7
      - --label=org.opencontainers.image.title={{ .ProjectName }}
      - --label=org.opencontainers.image.description={{ .ProjectName }}
      - --label=org.opencontainers.image.url=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_ORG }}/mailview
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=AGPL-3.0
    dockerfile: Dockerfile.goreleaser
    extra_files:
      - config.toml.sample
      - docker-entrypoint.sh

docker_manifests:
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-arm64v8
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-armv6
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:latest-armv7
  - name_template: ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}
    image_templates:
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-amd64
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-arm64v8
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-armv6
      - ghcr.io/{{ .Env.GITHUB_ORG }}/mailview:{{ .Tag }}-armv7

release:
  name_template: "MailView {{ .Tag }}"

checksum:
  name_template: "MailView_{{ .Version }}_checksums.txt"
